# Feature specification for model training (to fill in next sprint).
# One entry per feature the model uses. Keep it next to the training code and version it with the code.
# The two entries below are examples of the format only.

feature_set_version: v0          # bump when any feature is added, removed or changed
source_table: tennis_features.<feature_table>
random_seed: 42                  # provenance.SEED: pass as random_state= to every model, sampler and CV splitter
label: a_won                     # INTEGER, 1 if player A won
row_filter: modelling_ok = TRUE AND split IN ('train', 'dev')

features:
  - name: rank_diff
    dtype: FLOAT64
    definition: LOG(b_rank) - LOG(a_rank)          # how it is computed
    inputs: [a_rank, b_rank]                         # columns from the data dictionary
    known_before_match: yes                          # must be yes for every feature
    missing: "unranked player -> rank set to 1500, plus flag rank_missing"
    notes: ""

  - name: a_surface_win_rate_52w
    dtype: FLOAT64
    definition: share of A's matches won on this surface in the 52 weeks before tourney_date
    inputs: [a_id, surface, tourney_date, a_won]
    known_before_match: yes (uses earlier matches only, including the 2010-2015 warmup seasons)
    missing: "no earlier matches -> NULL, plus count feature a_surface_matches_52w"
    notes: "post_ columns may feed history features like this one, never the current match"
